<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=700"/>
  <title>noorm wordmark — dark</title>
  <link rel="stylesheet" href="_card.css"/>
  <style>
    body { background: var(--ink-900); padding: 0; color: var(--fg-1); }
    .stage { height: 220px; display: grid; place-items: center; }
    .wm { font-family: var(--font-sans); font-weight: 600; font-size: 96px; letter-spacing: -0.04em; color: #F2ECE0; display: inline-flex; align-items: center; line-height: 1; }
    .wm .cursor { display: inline-block; width: 0.45em; height: 0.55em; background: var(--ember-500); margin-left: 0.04em; transform: translateY(0.04em); animation: blink 1.1s steps(1,end) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }
    .meta-row { padding: 14px 24px 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
    .meta-row .l { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.02em; }
  </style>
</head>
<body class="card" style="padding:0;">
  <div class="stage"><span class="wm">noorm<span class="cursor"></span></span></div>
  <div class="meta-row">
    <span class="l">Cursor blinks 1.1s · ember-500 on ink-900 · cream fg</span>
    <span class="l">noorm-logo-dark.svg</span>
  </div>
</body>
</html>
