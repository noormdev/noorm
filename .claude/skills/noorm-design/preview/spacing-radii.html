<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <title>radii</title>
  <link rel="stylesheet" href="_card.css"/>
  <style>
    body { background: var(--paper-200); padding: 24px; }
    .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .tile { width: 80px; height: 80px; background: var(--paper-50); border: 1px solid var(--border); }
    .name { font-family: var(--font-mono); font-size: 11px; color: var(--ink-800); }
    .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
    .ctx { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    code { font-family: var(--font-mono); font-size: 11px; padding: 3px 7px; background: var(--paper-300); border: 1px solid var(--border); border-radius: 4px; color: var(--ink-800); }
    .pill { padding: 6px 12px; border-radius: 999px; background: var(--paper-50); border: 1px solid var(--border); font-family: var(--font-sans); font-size: 12px; color: var(--ink-800); }
    .btn { padding: 8px 14px; border-radius: 6px; background: var(--ember-500); color: #fff; font-family: var(--font-sans); font-size: 13px; font-weight: 500; border: 0; }
    .cardish { padding: 8px 12px; border-radius: 10px; background: var(--paper-50); border: 1px solid var(--border); font-family: var(--font-sans); font-size: 12px; color: var(--ink-800); }
  </style>
</head>
<body class="card">
  <div class="eyebrow" style="margin-bottom:14px">Radii — restrained · cards look like documents, not buttons</div>
  <div class="row">
    <div class="item"><div class="tile" style="border-radius:0"></div><div class="name">none</div><div class="px">0</div></div>
    <div class="item"><div class="tile" style="border-radius:4px"></div><div class="name">xs</div><div class="px">4 · code, kbd</div></div>
    <div class="item"><div class="tile" style="border-radius:6px"></div><div class="name">sm</div><div class="px">6 · default</div></div>
    <div class="item"><div class="tile" style="border-radius:10px"></div><div class="name">md</div><div class="px">10 · cards</div></div>
    <div class="item"><div class="tile" style="border-radius:14px"></div><div class="name">lg</div><div class="px">14 · feature</div></div>
    <div class="item"><div class="tile" style="border-radius:999px;width:80px;height:40px"></div><div class="name">full</div><div class="px">pills only</div></div>
  </div>
  <div class="ctx">
    <code>4</code><span class="pill" style="border-radius:999px">filter chip</span><button class="btn">Get started</button><div class="cardish">// card · radius-md</div>
  </div>
</body>
</html>
