<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <title>code block</title>
  <link rel="stylesheet" href="_card.css"/>
  <style>
    body { background: #161A20; padding: 24px; color: #F2ECE0; }
    .eyebrow { color: #7E8590; }
    .frame { background: #0F1216; border: 1px solid #2F3540; border-radius: 10px; overflow: hidden; }
    .head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #2F3540; background: #161A20; }
    .head .left { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: #7E8590; letter-spacing: 0.04em; }
    .head .copy { font-family: var(--font-mono); font-size: 11px; color: #B8B3A8; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .head .copy svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    pre { margin: 0; padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: #F2ECE0; overflow: auto; }
    .prompt { color: #916336; }
    .out { color: #6E8F4E; }
    .cmt { color: #7E8590; }
    .key { color: #ED7561; }
    .num { color: #B47A45; }
    .str { color: #C2C0B5; }
    .cursor { display: inline-block; width: 8px; height: 14px; background: #E05742; vertical-align: -2px; margin-left: 2px; animation: blink 1.1s steps(1,end) infinite; }
    @keyframes blink { 50% { opacity: 0.2 } }
  </style>
</head>
<body class="card">
  <div class="eyebrow" style="margin-bottom:12px">Code block — terminal voice · 5-color highlight · ember cursor</div>
  <div class="frame">
    <div class="head"><div class="left"><span>bash</span><span style="color:#454A59">·</span><span>install.sh</span></div><div class="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>copy</div></div>
<pre><span class="cmt"># Install (no sudo needed)</span>
<span class="prompt">$</span> curl -fsSL <span class="str">https://noorm.dev/install.sh</span> | sh

<span class="cmt"># Or via npm</span>
<span class="prompt">$</span> npm install -g <span class="str">@noormdev/cli</span>

<span class="prompt">$</span> noorm run build
  <span class="out">✓</span> Executed <span class="num">1</span> file
  <span class="out">✓</span> Schema in sync with <span class="key">dev</span>
<span class="prompt">$</span> noorm change ff<span class="cursor"></span>
</pre>
  </div>
</body>
</html>
