<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <title>buttons</title>
  <link rel="stylesheet" href="_card.css"/>
  <style>
    body { background: var(--paper-200); padding: 24px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); width: 100%; margin-bottom: 4px; }
    button { font-family: var(--font-sans); font-weight: 500; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 120ms cubic-bezier(0.4,0,0.2,1); }
    button svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .btn { padding: 9px 14px; font-size: 14px; border-radius: 6px; }
    .btn-lg { padding: 12px 20px; font-size: 15px; border-radius: 8px; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 5px; }
    .primary { background: var(--ember-500); color: #fff; }
    .primary:hover { background: var(--ember-700); }
    .secondary { background: #FFFFFF; color: var(--ink-800); border-color: var(--border); }
    .secondary:hover { border-color: var(--ink-200); background: var(--paper-100); }
    .ghost { background: transparent; color: var(--ink-800); }
    .ghost:hover { background: var(--paper-300); }
    .danger { background: transparent; color: var(--ember-500); border-color: var(--ember-500); }
    .danger:hover { background: var(--ember-500); color: #fff; }
    .disabled { opacity: 0.4; cursor: not-allowed; }
    .pressed { background: var(--ember-900); color: #fff; }
    .focused { outline: 2px solid var(--ember-500); outline-offset: 2px; }
  </style>
</head>
<body class="card">
  <div class="eyebrow" style="margin-bottom:14px">Buttons — primary ember · 6 px radius · 120 ms</div>

  <div class="row"><span class="lbl">Hierarchy</span></div>
  <div class="row">
    <button class="btn primary">Get started <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    <button class="btn secondary">View on GitHub</button>
    <button class="btn ghost">Skip</button>
    <button class="btn danger">Drop schema</button>
  </div>

  <div class="row"><span class="lbl">States — primary</span></div>
  <div class="row">
    <button class="btn primary">Default</button>
    <button class="btn primary" style="background:var(--ember-700)">Hover</button>
    <button class="btn pressed">Press</button>
    <button class="btn primary focused">Focused</button>
    <button class="btn primary disabled">Disabled</button>
  </div>

  <div class="row"><span class="lbl">Sizes</span></div>
  <div class="row">
    <button class="btn-lg primary">Large · 15 / 12 px</button>
    <button class="btn primary">Default · 14 / 9 px</button>
    <button class="btn-sm primary">Small · 12 / 6 px</button>
  </div>
</body>
</html>
