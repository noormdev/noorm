# Docker Compose configuration for integration tests
# Uses non-default ports to avoid conflicts with local databases
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --wait
#   yarn test:integration
#   docker compose -f docker-compose.test.yml down -v

services:
  postgres:
    image: postgres:17-alpine
    container_name: noorm-test-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: noorm_test
      POSTGRES_PASSWORD: noorm_test
      POSTGRES_DB: noorm_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noorm_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: noorm-test-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: noorm_test
      MYSQL_DATABASE: noorm_test
      MYSQL_USER: noorm_test
      MYSQL_PASSWORD: noorm_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/mysql

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: noorm-test-mssql
    ports:
      - "11433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "NoOrm_Test123!"
      MSSQL_PID: Developer
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "NoOrm_Test123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # TLS-enforcing services: "Live TLS Tests" in docs/dev/ci.md. Each server refuses a key its
  # own user does not own, so each start copies the mounted files instead of reading them in place.

  postgres-tls:
    profiles: ["tls"]
    image: postgres:17-alpine
    container_name: noorm-test-postgres-tls
    ports:
      - "${TEST_POSTGRES_TLS_PORT:-15433}:5432"
    environment:
      POSTGRES_USER: noorm_tls
      POSTGRES_PASSWORD: noorm_tls
      POSTGRES_DB: noorm_tls_test
    volumes:
      - ./tests/fixtures/tls/generated:/tls:ro
      - ./tests/fixtures/tls/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    entrypoint:
      - sh
      - -ec
      - |
        mkdir -p /certs
        cp /tls/ca.pem /tls/postgres.pem /tls/postgres.key /certs/
        chown -R postgres:postgres /certs
        chmod 0600 /certs/postgres.key
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_ca_file=/certs/ca.pem
      - -c
      - ssl_cert_file=/certs/postgres.pem
      - -c
      - ssl_key_file=/certs/postgres.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # Over TCP: the image's first-run server listens on the socket only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U noorm_tls -d noorm_tls_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  mysql-tls:
    profiles: ["tls"]
    image: mysql:8.0
    container_name: noorm-test-mysql-tls
    ports:
      - "${TEST_MYSQL_TLS_PORT:-13307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: noorm_tls
      MYSQL_DATABASE: noorm_tls_test
      MYSQL_USER: noorm_tls
      MYSQL_PASSWORD: noorm_tls
    volumes:
      - ./tests/fixtures/tls/generated:/tls:ro
      - ./tests/fixtures/tls/mysql-accounts.sql:/docker-entrypoint-initdb.d/accounts.sql:ro
    entrypoint:
      - sh
      - -ec
      - |
        mkdir -p /certs
        cp /tls/ca.pem /tls/mysql.pem /tls/mysql.key /certs/
        chown -R mysql:mysql /certs
        chmod 0600 /certs/mysql.key
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - mysqld
      - --require-secure-transport=ON
      - --ssl-ca=/certs/ca.pem
      - --ssl-cert=/certs/mysql.pem
      - --ssl-key=/certs/mysql.key
    # Over TCP: the image's first-run server listens on the socket only.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/mysql

  mssql-tls:
    profiles: ["tls"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: noorm-test-mssql-tls
    ports:
      - "${TEST_MSSQL_TLS_PORT:-11435}:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "NoOrm_Test123!"
      MSSQL_PID: Developer
      HOME: /home/mssql
    volumes:
      - ./tests/fixtures/tls/generated:/tls:ro
      - ./tests/fixtures/tls/mssql.conf:/etc/mssql.conf:ro
    # Root only for the copy; the server itself runs as the image's mssql user.
    user: root
    entrypoint:
      - sh
      - -ec
      - |
        mkdir -p /certs
        cp /tls/mssql.pem /tls/mssql.key /certs/
        cp /etc/mssql.conf /var/opt/mssql/mssql.conf
        chown -R mssql /certs /var/opt/mssql
        chmod 0600 /certs/mssql.key
        (until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -b \
            -Q "IF DB_ID('noorm_tls_test') IS NULL CREATE DATABASE noorm_tls_test" >/dev/null 2>&1; do sleep 1; done) &
        exec setpriv --reuid=mssql --regid=mssql --init-groups /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "NoOrm_Test123!" -C -d noorm_tls_test -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
