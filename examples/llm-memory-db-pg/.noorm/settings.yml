build:
    include:
        - 00_types
        - 01_reference
        - 02_tables
        - 03_subtypes
        - 04_binary
        - 05_seeds
        - 06_functions
        - 07_views
        - 08_procedures
        - 09_triggers
paths:
    sql: ./sql
    changes: ./changes
rules:
    - description: Include test seeds
      match:
          isTest: true
      include:
          - 05_seeds
stages:
    dev:
        description: Local development database
        locked: false
        defaults:
            dialect: postgres
            host: localhost
            port: 15432
            database: noorm_llm_dev
            user: noorm_test
            password: noorm_test
            isTest: false
    test:
        description: Local test database
        locked: false
        defaults:
            dialect: postgres
            host: localhost
            port: 15432
            database: noorm_llm_test
            user: noorm_test
            password: noorm_test
            isTest: true
logging:
    enabled: true
    level: info
    file: .noorm/state/noorm.log
    maxSize: 10mb
    maxFiles: 5
