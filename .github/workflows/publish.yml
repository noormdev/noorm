name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.changeset/**'
      - 'packages/*/package.json'
      - '.github/workflows/publish.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build and upload binaries
    needs: release
    if: >-
      needs.release.outputs.published == 'true' &&
      contains(needs.release.outputs.publishedPackages, '@noormdev/cli')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get CLI version
        id: version
        run: echo "tag=@noormdev/cli@$(jq -r .version packages/cli/package.json)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: bun run build:binary

      - name: Generate checksums
        working-directory: packages/cli/bin
        run: |
          shasum -a 256 noorm-* > checksums.txt
          cat checksums.txt

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            packages/cli/bin/noorm-*
            packages/cli/bin/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
